name: Build Glover Android Native Port with Touch Controls

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar NDK y CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"

    - name: Descargar e Integrar SDL2 para Android
      run: |
        git clone https://github.com/libsdl-org/SDL.git -b SDL2 --depth 1 sdl2_src

    - name: Generar CMakeLists.txt Universal Adaptado
      run: |
        # Si el repositorio no tiene un CMakeLists nativo compatible, inyectamos uno adaptado para Android + SDL2
        if [ ! -f "CMakeLists.txt" ]; then
          echo "Creando CMakeLists.txt integrado..."
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.18)
          project(glover_android C CXX)
          set(CMAKE_CXX_STANDARD 17)
          add_subdirectory(sdl2_src)
          file(GLOB_RECURSE SRC_FILES "src/*.c" "src/*.cpp")
          add_library(main SHARED ${SRC_FILES})
          target_link_libraries(main SDL2 log GLESv2 EGL z)
        EOF
        fi

    - name: Compilar Código C/C++ a Librería Nativa .so
      run: |
        mkdir -p build_android
        cd build_android
        $ANDROID_HOME/cmake/3.22.1/bin/cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Empaquetar Estructura APK y Assets
      run: |
        mkdir -p out/apk_structure/lib/arm64-v8a
        find build_android -name "*.so" -exec cp {} out/apk_structure/lib/arm64-v8a/ \;
        
        # Si existe una carpeta de assets del juego, la incluimos
        if [ -d "assets" ]; then
          cp -r assets out/apk_structure/
        fi

        cd out/apk_structure && zip -r ../Glover_Android_Port_Touch.apk . || cd ../..

    - name: Subir APK Final
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-Touch-Port
        path: out/Glover_Android_Port_Touch.apk

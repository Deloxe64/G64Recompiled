name: Build Glover Android Port (Auto-ROM Asset Extractor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Android SDK y NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "ndk;25.2.9519653" \
          "cmake;3.22.1" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Descargar Plantilla Oficial SDL2 Android
      run: |
        rm -rf sdl2_source
        git clone https://github.com/libsdl-org/SDL.git -b SDL2 --depth 1 sdl2_source

    - name: Configurar Permisos de ROM y Estructura NDK
      run: |
        JNI_DIR="sdl2_source/android-project/app/jni"
        MANIFEST_FILE="sdl2_source/android-project/app/src/main/AndroidManifest.xml"

        # 1. Modificar AndroidManifest para otorgar acceso a almacenamiento de la ROM .z64
        sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' $MANIFEST_FILE

        # 2. Copiar las fuentes de SDL2
        mkdir -p $JNI_DIR/SDL2
        cp -r sdl2_source/src $JNI_DIR/SDL2/
        cp -r sdl2_source/include $JNI_DIR/SDL2/
        cp sdl2_source/Android.mk $JNI_DIR/SDL2/

        # 3. Copiar fuentes del juego
        mkdir -p $JNI_DIR/src
        find . -maxdepth 2 -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) ! -path "./sdl2_source*" -exec cp {} $JNI_DIR/src/ \; || true
        if [ -d "src" ]; then
          cp -r src/* $JNI_DIR/src/ || true
        fi

        # 4. Android.mk con banderas para lectura de ROM N64 (.z64 US)
        cat << 'EOF' > $JNI_DIR/Android.mk
        LOCAL_PATH := $(call my-dir)

        include $(CLEAR_VARS)
        LOCAL_MODULE := main

        LOCAL_C_INCLUDES := $(LOCAL_PATH)/SDL2/include $(LOCAL_PATH)/src

        FILE_LIST := $(wildcard $(LOCAL_PATH)/src/*.c) $(wildcard $(LOCAL_PATH)/src/*.cpp)
        LOCAL_SRC_FILES := $(FILE_LIST:$(LOCAL_PATH)/%=%)

        LOCAL_SHARED_LIBRARIES := SDL2
        LOCAL_LDLIBS := -lGLESv2 -lEGL -llog -landroid -lm -lz
        LOCAL_CFLAGS += -w -D__ANDROID__ -DAUTO_EXTRACT_Z64_US

        include $(BUILD_SHARED_LIBRARY)
        EOF

        cat << 'EOF' > $JNI_DIR/Application.mk
        APP_ABI := arm64-v8a
        APP_PLATFORM := android-21
        APP_STL := c++_shared
        APP_ALLOW_MISSING_DEPS := true
        EOF

    - name: Compilar APK con Gradle
      run: |
        cd sdl2_source/android-project
        chmod +x gradlew
        export ANDROID_HOME=$ANDROID_HOME
        export NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        ./gradlew assembleRelease

    - name: Extraer APK Generado
      run: |
        mkdir -p out_apk
        find sdl2_source/android-project/ -name "*.apk" | head -n 1 | xargs -I {} cp {} out_apk/Glover_Port_AutoROM.apk

    - name: Subir Artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-AutoROM-APK
        path: out_apk/Glover_Port_AutoROM.apk

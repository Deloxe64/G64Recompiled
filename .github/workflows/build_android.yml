name: Build SDL2 Android Base APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Android SDK y NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "ndk;25.2.9519653" \
          "cmake;3.22.1" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Descargar Plantilla Oficial SDL2 Android
      run: |
        git clone https://github.com/libsdl-org/SDL.git -b SDL2 --depth 1 sdl2_source

    - name: Integrar Código del Proyecto
      run: |
        # Crear la carpeta de código nativo dentro de la plantilla oficial
        mkdir -p sdl2_source/android-project/app/jni/src
        
        # Copiar tus archivos C/C++ si existen en el repositorio
        find . -maxdepth 2 -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) ! -path "./sdl2_source*" -exec cp {} sdl2_source/android-project/app/jni/src/ \; || true

        # Si hay una carpeta src en tu repo, la copiamos también
        if [ -d "src" ]; then
          cp -r src/* sdl2_source/android-project/app/jni/src/ || true
        fi

    - name: Compilar APK con Gradle Oficial
      run: |
        cd sdl2_source/android-project
        chmod +x gradlew
        export ANDROID_HOME=$ANDROID_HOME
        export NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        ./gradlew assembleRelease

    - name: Extraer APK Generado
      run: |
        mkdir -p out_apk
        find sdl2_source/android-project/ -name "*.apk" -exec cp {} out_apk/Glover_Port_Base.apk \;

    - name: Subir Artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-Base-APK
        path: out_apk/Glover_Port_Base.apk

name: Build Glover Android Native Port

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar NDK, CMake y SDK Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "ndk;25.2.9519653" \
          "cmake;3.22.1" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Descargar SDL2 Oficial para Android
      run: |
        rm -rf sdl2_src
        git clone https://github.com/libsdl-org/SDL.git -b SDL2 --depth 1 sdl2_src

    - name: Generar Archivo CMake Infalible con Buscador Global
      run: |
        cat << 'EOF' > CMakeLists.txt
        cmake_minimum_required(VERSION 3.18)
        project(GloverAndroid C CXX)

        set(CMAKE_CXX_STANDARD 17)
        set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -w")
        set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -w")

        add_subdirectory(sdl2_src)

        file(GLOB_RECURSE GAME_SOURCES 
            "*.c" "*.cpp" "*.cc" "*.cxx"
        )
        list(FILTER GAME_SOURCES EXCLUDE REGEX ".*sdl2_src/.*")

        add_library(main SHARED ${GAME_SOURCES})

        file(GLOB_RECURSE ALL_HEADERS "*.h" "*.hpp")
        foreach(hdr ${ALL_HEADERS})
            get_filename_component(hdr_dir ${hdr} PATH)
            include_directories(${hdr_dir})
        endforeach()

        target_include_directories(main PRIVATE 
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_CURRENT_SOURCE_DIR}/sdl2_src/include
        )

        target_link_libraries(main 
            SDL2 
            log 
            android 
            GLESv2 
            EGL 
            m 
            z
        )
        EOF

    - name: Compilar Código C/C++ a ARM64 con NDK
      run: |
        mkdir -p build_android
        cd build_android
        $ANDROID_HOME/cmake/3.22.1/bin/cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Empaquetar Artefacto APK / Librerías Nativas
      run: |
        mkdir -p out/Glover_APK_Files/lib/arm64-v8a
        find build_android -name "*.so" -exec cp {} out/Glover_APK_Files/lib/arm64-v8a/ \;
        
        if [ -d "assets" ]; then
          cp -r assets out/Glover_APK_Files/
        fi

        cd out/Glover_APK_Files && zip -r ../Glover_Android_Port_ARM64.apk . || cd ../..

    - name: Subir Archivo Resultante
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-Port-ARM64
        path: out/Glover_Android_Port_ARM64.apk

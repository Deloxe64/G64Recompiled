name: Build Glover Android Native Port with Touch Controls

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar NDK y CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"

    - name: Otorgar permisos a Gradle
      run: |
        if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

    - name: Compilar APK y Librerías NDK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleRelease
        else
          echo "Compilando código C/C++ para ARM64..."
          mkdir build_android
          cd build_android
          $ANDROID_HOME/cmake/3.22.1/bin/cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
        fi

    - name: Organizar Archivos de Salida
      run: |
        mkdir -p out/
        find . -name "*.apk" -exec cp {} out/Glover_Android_Touch.apk \; || true
        find . -name "*.so" -exec cp {} out/ \; || true

    - name: Subir APK Resultante
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-Native-Port
        path: out/

name: Build Glover Android Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio del Puerto
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Android SDK, NDK y Gradle
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "ndk;25.2.9519653" \
          "cmake;3.22.1" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Clonar la Plantilla SDL2 Android Oficial
      run: |
        git clone https://github.com/libsdl-org/SDL.git sdl_android_template
        # Copiar la estructura de soporte de Android provista por SDL2
        cp -r sdl_android_template/android-project app/ || true

    - name: Integrar Código C/C++ del Puerto en la App
      run: |
        mkdir -p app/jni/src
        # Mover o copiar los archivos fuente del juego a la ruta que lee el NDK de Android
        if [ -d "src" ]; then
          cp -r src/* app/jni/src/
        else
          cp -r *.c *.cpp *.h app/jni/src/ || true
        end

        # Crear un Android.mk universal para compilar todo el motor nativo
        cat << 'EOF' > app/jni/src/Android.mk
        LOCAL_PATH := $(call my-dir)

        include $(CLEAR_VARS)
        LOCAL_MODULE := main

        # Buscar todos los archivos fuente del juego
        LOCAL_SRC_FILES := $(wildcard $(LOCAL_PATH)/*.cpp) $(wildcard $(LOCAL_PATH)/*.c)
        LOCAL_C_INCLUDES := $(LOCAL_PATH)

        LOCAL_LDLIBS := -llog -landroid -lGLESv2 -lEGL -lz
        LOCAL_SHARED_LIBRARIES := SDL2

        include $(BUILD_SHARED_LIBRARY)
        EOF

    - name: Compilar APK Nativo con Gradle
      run: |
        export NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        cd app
        ./gradlew assembleRelease

    - name: Extraer y Guardar el APK Generado
      run: |
        mkdir -p out_apk
        find app/ -name "*.apk" -exec cp {} out_apk/Glover_Native_Android.apk \;

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-Native-APK
        path: out_apk/Glover_Native_Android.apk

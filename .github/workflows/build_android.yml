name: Build Glover Android Port (Kotlin + NDK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-kotlin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Android SDK, NDK y Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "ndk;25.2.9519653" \
          "cmake;3.22.1" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: Clonar e Integrar SDL2
      run: |
        rm -rf sdl2_src
        git clone https://github.com/libsdl-org/SDL.git -b SDL2 --depth 1 sdl2_src

    - name: Construir Estructura Android con Kotlin
      run: |
        mkdir -p android_app/app/src/main/java/com/glover/port
        mkdir -p android_app/app/src/main/jni
        mkdir -p android_app/app/src/main/res/values

        # 1. Crear el MainActivity escrito en Kotlin
        cat << 'EOF' > android_app/app/src/main/java/com/glover/port/MainActivity.kt
        package com.glover.port

        import org.libsdl.app.SDLActivity

        class MainActivity : SDLActivity() {
            override fun getLibraries(): Array<String> {
                return arrayOf(
                    "SDL2",
                    "main"
                )
            }
        }
        EOF

        # Copiar las clases Java internas que SDL2 necesita para funcionar
        cp -r sdl2_src/android-project/app/src/main/java/org android_app/app/src/main/java/

        # 2. Crear AndroidManifest.xml
        cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.glover.port">

            <uses-feature android:glEsVersion="0x00020000" android:required="true" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

            <application
                android:label="Glover Native Port"
                android:allowBackup="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                
                <activity android:name=".MainActivity"
                    android:configChanges="orientation|keyboardHidden|screenSize"
                    android:screenOrientation="sensorLandscape"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 3. Copiar código fuente C/C++ del juego al directorio JNI
        cp -r sdl2_src android_app/app/src/main/jni/SDL2
        find . -maxdepth 3 -type f \( -name "*.c" -o -name "*.cpp" \) ! -path "*/sdl2_src/*" ! -path "*/android_app/*" -exec cp {} android_app/app/src/main/jni/ \; || true
        find . -maxdepth 3 -type f \( -name "*.h" -o -name "*.hpp" \) ! -path "*/sdl2_src/*" ! -path "*/android_app/*" -exec cp {} android_app/app/src/main/jni/ \; || true

        # 4. Crear Android.mk y Application.mk para compilar con NDK
        cat << 'EOF' > android_app/app/src/main/jni/Android.mk
        LOCAL_PATH := $(call my-dir)

        include $(CLEAR_VARS)
        LOCAL_MODULE := main

        SDL_PATH := ./SDL2
        LOCAL_C_INCLUDES := $(LOCAL_PATH)/$(SDL_PATH)/include $(LOCAL_PATH)

        FILE_LIST := $(wildcard $(LOCAL_PATH)/*.c) $(wildcard $(LOCAL_PATH)/*.cpp)
        LOCAL_SRC_FILES := $(FILE_LIST:$(LOCAL_PATH)/%=%)

        LOCAL_SHARED_LIBRARIES := SDL2
        LOCAL_LDLIBS := -lGLESv2 -lEGL -llog -landroid -lm -lz
        LOCAL_CFLAGS += -w -D__ANDROID__

        include $(BUILD_SHARED_LIBRARY)
        EOF

        cat << 'EOF' > android_app/app/src/main/jni/Application.mk
        APP_ABI := arm64-v8a
        APP_PLATFORM := android-21
        APP_STL := c++_shared
        EOF

        # 5. Configurar Gradle con soporte para Kotlin
        cat << 'EOF' > android_app/settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > android_app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > android_app/app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.glover.port"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
                ndk {
                    abiFilters 'arm64-v8a'
                }
            }
            externalNativeBuild {
                ndkBuild {
                    path 'src/main/jni/Android.mk'
                }
            }
        }

        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
        }
        EOF

    - name: Compilar APK con Gradle y Kotlin
      run: |
        cd android_app
        export NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        ./gradlew assembleRelease || ./gradlew assembleDebug

    - name: Extraer y Guardar APK
      run: |
        mkdir -p out/
        find android_app/ -name "*.apk" -exec cp {} out/Glover_Kotlin_Port.apk \;

    - name: Subir Artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: Glover-Android-Kotlin-Port
        path: out/Glover_Kotlin_Port.apk
